---
networks:
  mcxd-mongodb-net:
    external: true

services:
  mcxd-mongo-populate:
    container_name: mcxd-mongo-populate-container
    build: .
    environment:
      - MONGODB_URI=mongodb://mongo:27017/
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=mc-discover-mcxd
      - S3_PREFIX=mc2d-mongo-dumps/collections-v2/
    networks:
      - mcxd-mongodb-net
