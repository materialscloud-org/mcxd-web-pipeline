---
networks:
  mc-rest-api-net:
    external: true

services:
  mc-mongo-populate:
    container_name: mc-mongo-populate-container
    build: .
    environment:
      - MONGODB_URI=mongodb://mongo:27017/
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=mc-discover-mcxd
      - S3_PREFIX=mc3d-mongo-dumps/collections-v2/
    networks:
      - mc-rest-api-net
