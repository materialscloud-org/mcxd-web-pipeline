---
networks:
  mcxd-mongodb-net:
    external: true

services:
  mcxd-rest-api:
    container_name: mcxd-rest-api-container
    build: .
    restart: always
    ports:
      - "8001:80"
    environment:
      - MC_MONGODB_URI=mongodb://mongo:27017/
      - ROOT_PATH=/mcxd-rest-api
    networks:
      - mcxd-mongodb-net
